<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App demo</title>
<!--
  One demo slide: the app video inside an iPhone bezel, and a chapter list that
  follows the video, so you can talk over it without clicking anything.

  Files this page expects next to it:
    demo.mp4                    your cut take, ~604 px wide (see demo-edit.py)
    iphone-17-pro-silver.png    Apple's bezel. Not included, download it from
                                https://developer.apple.com/design/resources/
                                (Product Bezels, iPhone 17 Pro, Silver) and put
                                the PNG here. Without it the phone is drawn as a
                                plain rounded frame.

  The bezel geometry below is that PNG's own: 1350x2760, screen opening at
  72,69, 1206x2622, corner radius 184. 1206x2622 is also the simulator's native
  size, so the footage fits the opening pixel for pixel. Another bezel needs its
  own numbers, measured from its alpha channel.

  Chapters: one <li> per part of the video, data-at in seconds. Scrub the video
  and write down where each part starts.

  Keys: space or click plays and pauses, R restarts, F goes full screen.
-->
<style>
  :root {
    --ink: #0d0d0f;
    --muted: #6b6b70;
    --dim: #a7a7ad;
    --line: #e7e5e1;
    --accent: #ff7e35;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 4vh 5vw;
  }

  .slide {
    width: 100%;
    max-width: 1400px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 6vw;
  }

  .kicker { margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0 0 32px; font-size: clamp(32px, 4.4vw, 64px); line-height: 1.05; letter-spacing: -.03em; }

  /* The chapter playing is ink and bold, the ones before it read as done, and
     a line under the current one fills as that part of the video runs. */
  .chapters { list-style: none; margin: 0; padding: 0; max-width: 640px; }
  .chapters li {
    position: relative;
    padding: 14px 0 16px;
    border-top: 1px solid var(--line);
    font-size: clamp(16px, 1.7vw, 26px);
    line-height: 1.25;
    color: var(--dim);
    cursor: pointer;
    transition: color .45s ease;
  }
  .chapters li:first-child { border-top: 3px solid var(--ink); }
  .chapters li.done { color: var(--muted); }
  .chapters li.on { color: var(--ink); font-weight: 700; }
  .chapters li::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 3px;
    background: var(--accent);
    transform-origin: left center;
    transform: scaleX(var(--p, 0));
    opacity: 0;
    transition: opacity .3s ease;
  }
  .chapters li.on::after { opacity: 1; }

  /* Everything is a percentage of the bezel, so the phone can be any height. */
  .iphone {
    position: relative;
    height: min(88vh, 900px);
    aspect-ratio: 1350 / 2760;
    filter: drop-shadow(0 30px 44px rgba(0,0,0,.2)) drop-shadow(0 6px 14px rgba(0,0,0,.1));
  }
  .iphone .screen {
    position: absolute;
    left: 5.333%; top: 2.5%;
    width: 89.333%; height: 95%;
    border-radius: 15.257% / 7.018%;   /* 184 / 1206 and 184 / 2622 */
    overflow: hidden;
    background: #0b0b0c;
  }
  .iphone video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .iphone .bezel { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* No bezel PNG yet: draw a plain frame so the page still works. */
  .iphone.no-bezel .screen { inset: 0; width: 100%; height: 100%; border: 10px solid #1c1c1e; border-radius: 13% / 6.4%; }

  @media (max-width: 800px) {
    body { place-items: start center; }
    .slide { grid-template-columns: 1fr; }
    .iphone { height: 70vh; margin: 0 auto; grid-row: 1; }
  }
</style>
</head>
<body>

<section class="slide">
  <div>
    <p class="kicker">Your app</p>
    <h1>From install to the first result</h1>
    <ol class="chapters" data-for="demo">
      <li data-at="0">The first screen</li>
      <li data-at="5">Picking an option</li>
      <li data-at="14">Searching</li>
      <li data-at="30">The result</li>
    </ol>
  </div>

  <div class="iphone">
    <div class="screen">
      <video id="demo" src="demo.mp4" muted playsinline loop preload="auto"></video>
    </div>
    <img class="bezel" src="iphone-17-pro-silver.png" alt=""
         onerror="this.remove(); document.querySelector('.iphone').classList.add('no-bezel')">
  </div>
</section>

<script>
/* The chapter list follows the video it names. */
document.querySelectorAll('.chapters[data-for]').forEach((list) => {
  const video = document.getElementById(list.dataset.for);
  if (!video) return;
  const items = [...list.querySelectorAll('li')];
  const paint = () => {
    const t = video.currentTime;
    let current = 0;
    items.forEach((li, i) => { if (t >= Number(li.dataset.at)) current = i; });
    const from = Number(items[current].dataset.at);
    const to = items[current + 1] ? Number(items[current + 1].dataset.at) : (video.duration || from + 1);
    items.forEach((li, i) => {
      li.classList.toggle('on', i === current);
      li.classList.toggle('done', i < current);
      li.style.setProperty('--p', i === current ? Math.min(1, (t - from) / (to - from)) : 0);
    });
  };
  ['seeked', 'play', 'loadedmetadata', 'timeupdate'].forEach((e) => video.addEventListener(e, paint));
  // timeupdate fires about four times a second, which steps the line. A frame
  // loop while playing keeps it smooth.
  const loop = () => { paint(); if (!video.paused) requestAnimationFrame(loop); };
  video.addEventListener('play', () => requestAnimationFrame(loop));
  // Click a chapter to jump to it.
  items.forEach((li) => li.addEventListener('click', () => { video.currentTime = Number(li.dataset.at); video.play(); }));
  paint();
});

/* Plays itself once the page is open. Space or click to pause. */
const video = document.getElementById('demo');
video.play().catch(() => {});
const toggle = () => (video.paused ? video.play() : video.pause());
video.addEventListener('click', toggle);
document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  if (e.key === 'r' || e.key === 'R') { video.currentTime = 0; video.play(); }
  if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.();
});
</script>
</body>
</html>
